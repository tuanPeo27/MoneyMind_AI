server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Same-origin API, so the browser needs no CORS setup. "backend" is the service name on the Docker network.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI answers are streamed line by line: do not buffer them.
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # SignalR (notifications) needs WebSocket upgrade.
  location /hubs/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Hashed build assets can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
