<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="96x96" href="/logo-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-180.png" />
    <!-- The two Inter subsets declared in index.css: fetch them in parallel with the JS. -->
    <link rel="preload" href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource-variable/inter/files/inter-vietnamese-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/logo-96.png" as="image" />
    <!-- Page background before the CSS bundle arrives, so there is no white flash in dark mode. -->
    <style>html{background:#f6eff7}@media (prefers-color-scheme:dark){html{background:#0d1020}}</style>
    <meta name="description" content="MoneyMind AI — A clearer picture of your money. Personal finance, budgets, and insights in one workspace." />
    <title>MoneyMind AI — Your financial workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
